name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/figma-design-access-72mqlo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Turns GitHub Pages on for this repo if it isn't already (enablement: true)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files — upload the whole repo as-is
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
